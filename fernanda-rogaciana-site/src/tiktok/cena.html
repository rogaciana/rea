<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Lato:wght@400;900&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Animação determinística: window.desenhar(t) pinta o quadro do segundo t.
const DURACAO = 35;
const cv = document.getElementById("c");
const g = cv.getContext("2d");
const BORDO = "#6E1325", ROSADO = "#E3C2B0", CREME = "#FFF6F3";
const logo = new Image();
logo.src = "../assets/monograma-suave.png";

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const aparece = (t, t0, dur = 0.45) => {
  const x = clamp((t - t0) / dur);
  const c1 = 1.9, c3 = c1 + 1;
  return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
};
const entre = (t, a, b) => t >= a && t < b;
const suave = (t, t0, dur) => { const x = clamp((t - t0) / dur); return x * x * (3 - 2 * x); };

function texto(linhas, x, y, tam, o = {}) {
  const { cor = "#fff", borda = "#000", largBorda = tam / 7, fonte = "Lato", peso = 900, alinha = "center", altura = 1.15 } = o;
  g.save();
  g.font = `${peso} ${tam}px ${fonte}, sans-serif`;
  g.textAlign = alinha; g.textBaseline = "middle"; g.lineJoin = "round";
  [].concat(linhas).forEach((l, i) => {
    const yy = y + i * tam * altura;
    if (borda) { g.strokeStyle = borda; g.lineWidth = largBorda; g.strokeText(l, x, yy); }
    g.fillStyle = cor; g.fillText(l, x, yy);
  });
  g.restore();
}

// Legenda estilo "meme": entra com pulo e balança de leve.
function legenda(t, t0, t1, linhas, y, tam = 78, o = {}) {
  if (!entre(t, t0, t1)) return;
  const e = aparece(t, t0);
  const sai = 1 - suave(t, t1 - 0.25, 0.25);
  g.save();
  g.translate(540, y); g.scale(e * sai || 0.001, e * sai || 0.001);
  g.rotate(Math.sin((t - t0) * 9) * 0.012 * (1 - clamp((t - t0) / 1.2)));
  texto(linhas, 0, 0, tam, o);
  g.restore();
}

function rosto(cx, cy, r, humor, t) {
  const pisca = (t % 3.1) > 3.0 ? 0.15 : 1;
  const olho = (dx, grande) => {
    g.fillStyle = "#fff"; g.beginPath(); g.ellipse(cx + dx, cy - r * 0.1, r * (grande ? 0.27 : 0.2), r * (grande ? 0.3 : 0.22) * pisca, 0, 0, 7); g.fill();
    g.fillStyle = "#222"; g.beginPath(); g.arc(cx + dx + Math.sin(t * 2) * r * 0.04, cy - r * 0.1, r * 0.1 * (pisca > 0.5 ? 1 : 0.2), 0, 7); g.fill();
  };
  const grande = humor === "choque";
  olho(-r * 0.36, grande); olho(r * 0.36, grande);
  g.strokeStyle = "#3b2a2a"; g.lineWidth = r * 0.08; g.lineCap = "round";
  const sobr = (dx, dy, ang) => { g.beginPath(); g.moveTo(cx + dx - r * 0.18, cy - r * 0.42 + dy + ang * r * 0.18); g.lineTo(cx + dx + r * 0.18, cy - r * 0.42 + dy - ang * r * 0.18); g.stroke(); };
  if (humor === "preocupado") { sobr(-r * 0.36, 0, -1); sobr(r * 0.36, 0, 1); }
  else if (humor === "pensando") { sobr(-r * 0.36, 0, 0); sobr(r * 0.36, -r * 0.12, 0.7); }
  else if (humor === "choque") { sobr(-r * 0.36, -r * 0.18, 0); sobr(r * 0.36, -r * 0.18, 0); }
  g.beginPath();
  if (humor === "feliz") g.arc(cx, cy + r * 0.2, r * 0.32, 0.1, Math.PI - 0.1);
  else if (humor === "choque") g.ellipse(cx, cy + r * 0.45, r * 0.13, r * 0.18, 0, 0, 7);
  else if (humor === "preocupado") { g.moveTo(cx - r * 0.25, cy + r * 0.5); g.quadraticCurveTo(cx, cy + r * 0.32, cx + r * 0.25, cy + r * 0.5); }
  else { g.moveTo(cx - r * 0.22, cy + r * 0.42); g.lineTo(cx + r * 0.22, cy + r * 0.42); }
  g.stroke();
  if (humor === "preocupado") { // gota de suor
    const q = (t * 1.2) % 1;
    g.fillStyle = "#8fd3ff"; g.beginPath(); g.ellipse(cx + r * 0.85, cy - r * 0.3 + q * r * 0.6, r * 0.1, r * 0.16, 0, 0, 7); g.fill();
  }
}

function pessoa(x, y, e, o) {
  const { corpo = "#c9748a", pele = "#f1c9a5", cabelo = "#3a2418", humor = "calmo", t = 0, longo = false, fase = 0 } = o;
  const pulo = Math.abs(Math.sin(t * 3 + fase)) * 8 * e;
  g.save(); g.translate(x, y - pulo);
  const w = 130 * e, h = 190 * e, r = 62 * e;
  g.fillStyle = corpo; g.beginPath(); g.roundRect(-w / 2, -h, w, h, 36 * e); g.fill();
  g.fillStyle = "#4a3a46"; g.fillRect(-w * 0.38, -8 * e, w * 0.3, 8 * e); g.fillRect(w * 0.08, -8 * e, w * 0.3, 8 * e);
  const cy = -h - r * 0.75;
  if (longo) { g.fillStyle = cabelo; g.beginPath(); g.roundRect(-r * 1.1, cy - r * 0.9, r * 2.2, r * 2.7, r * 0.9); g.fill(); }
  g.fillStyle = pele; g.beginPath(); g.arc(0, cy, r, 0, 7); g.fill();
  g.fillStyle = cabelo; g.beginPath(); g.arc(0, cy - r * 0.12, r * 1.04, Math.PI * 1.02, Math.PI * 1.98); g.fill();
  rosto(0, cy, r, humor, t);
  g.restore();
}

function casa(x, y, e, o = {}) {
  const { janela = true, cor = "#f3dccd", telhado = "#a4283f" } = o;
  g.save(); g.translate(x, y); g.scale(e, e);
  g.fillStyle = cor; g.fillRect(-190, -250, 380, 250);
  g.fillStyle = telhado; g.beginPath(); g.moveTo(-235, -245); g.lineTo(0, -430); g.lineTo(235, -245); g.closePath(); g.fill();
  g.fillStyle = "#7a3a3a"; g.beginPath(); g.roundRect(-45, -150, 90, 150, [45, 45, 0, 0]); g.fill();
  g.fillStyle = "#ffd98a"; g.fillRect(-170, -215, 95, 85); g.fillRect(75, -215, 95, 85);
  g.strokeStyle = "#7a3a3a"; g.lineWidth = 6;
  g.strokeRect(-170, -215, 95, 85); g.strokeRect(75, -215, 95, 85);
  g.restore();
}

function moeda(x, y, e, cortada = false, t = 0) {
  g.save(); g.translate(x, y + Math.sin(t * 4) * 6); g.scale(e, e);
  g.fillStyle = "#f7c948"; g.strokeStyle = "#b8870b"; g.lineWidth = 8;
  g.beginPath(); g.arc(0, 0, 56, 0, 7); g.fill(); g.stroke();
  texto("?", 0, 4, 70, { cor: "#8a5f00", borda: null });
  if (cortada) { g.strokeStyle = "#d62839"; g.lineWidth = 16; g.lineCap = "round"; g.beginPath(); g.moveTo(-70, -70); g.lineTo(70, 70); g.moveTo(70, -70); g.lineTo(-70, 70); g.stroke(); }
  g.restore();
}

function selo(t, t0, linhas, x, y, tam, cor = "#d62839") {
  if (t < t0) return;
  const q = clamp((t - t0) / 0.25);
  const esc = 2.6 - 1.6 * (1 - Math.pow(1 - q, 3)); // "carimbo" caindo
  g.save(); g.translate(x, y); g.rotate(-0.13); g.scale(esc, esc); g.globalAlpha = Math.min(1, q * 2);
  const wTxt = Math.max(...[].concat(linhas).map(l => l.length)) * tam * 0.62 + 60;
  const hTxt = [].concat(linhas).length * tam * 1.15 + 40;
  g.strokeStyle = cor; g.lineWidth = 12; g.beginPath(); g.roundRect(-wTxt / 2, -hTxt / 2 + tam * 0.1, wTxt, hTxt, 18); g.stroke();
  texto(linhas, 0, -(([].concat(linhas).length - 1) * tam * 1.15) / 2 + tam * 0.1, tam, { cor, borda: null });
  g.restore();
}

function seta(x1, y1, x2, y2, cor, prog = 1) {
  const x = x1 + (x2 - x1) * prog, y = y1 + (y2 - y1) * prog;
  g.save(); g.strokeStyle = cor; g.fillStyle = cor; g.lineWidth = 12; g.lineCap = "round";
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x, y); g.stroke();
  const a = Math.atan2(y2 - y1, x2 - x1);
  g.beginPath(); g.moveTo(x, y); g.lineTo(x - 36 * Math.cos(a - 0.45), y - 36 * Math.sin(a - 0.45)); g.lineTo(x - 36 * Math.cos(a + 0.45), y - 36 * Math.sin(a + 0.45)); g.closePath(); g.fill();
  g.restore();
}

function fundo(t) {
  const gr = g.createLinearGradient(0, 0, 0, 1920);
  gr.addColorStop(0, "#7d1a2e"); gr.addColorStop(1, "#4f0d1a");
  g.fillStyle = gr; g.fillRect(0, 0, 1080, 1920);
  g.save(); g.globalAlpha = 0.06; g.strokeStyle = ROSADO; g.lineWidth = 3;
  for (let i = -2; i < 14; i++) for (let j = -2; j < 24; j++) {
    const cx = i * 110 + ((j % 2) * 55) + (t * 6) % 110, cy = j * 95;
    g.beginPath(); g.arc(cx, cy, 34, 0, 7); g.stroke();
  }
  g.restore();
  g.strokeStyle = ROSADO; g.lineWidth = 8; g.strokeRect(30, 30, 1020, 1860);
  g.lineWidth = 2; g.strokeRect(48, 48, 984, 1824);
}

function rodape() {
  texto(["Conteúdo informativo · Fonte: STJ, 04/11/2026"], 540, 1525, 30, { peso: 400, cor: ROSADO, borda: null });
  texto(["Fernanda Rogaciana · Advogada · OAB/SP 496.545"], 540, 1565, 30, { peso: 400, cor: ROSADO, borda: null });
}

function cena1(t) { // gancho
  casa(540, 1340, 1.5);
  pessoa(540, 1340, 1.5, { t, humor: "preocupado", longo: true, corpo: "#c9748a", cabelo: "#2c1b12" });
  if (t > 2.4) moeda(860, 1080, 1.2 * aparece(t, 2.4), false, t);
  legenda(t, 0.1, 5, ["Saiu do divórcio e", "ficou na casa", "com os filhos?"], 300, 92);
  legenda(t, 2.3, 5, ["Vai ter que pagar", "ALUGUEL pro ex?"], 650, 84, { cor: "#ffe066" });
}

function cena2(t) { // imóvel incomunicável
  const u = t - 5;
  casa(430, 1340, 1.45);
  pessoa(780, 1340, 1.45, { t, humor: "calmo", corpo: "#3f6f9e", cabelo: "#2c1b12", fase: 1 });
  legenda(t, 5.1, 11, ["Primeiro: o que é", "imóvel INCOMUNICÁVEL?"], 320, 80);
  if (u > 1.4) { // plaquinha
    const e = aparece(t, 6.4);
    g.save(); g.translate(430, 1040); g.scale(e, e);
    g.fillStyle = CREME; g.strokeStyle = "#7a3a3a"; g.lineWidth = 8; g.beginPath(); g.roundRect(-250, -70, 500, 140, 22); g.fill(); g.stroke();
    texto(["Comprado ANTES", "do casamento"], 0, -20, 48, { cor: "#6E1325", borda: null });
    g.restore();
  }
  if (u > 3.2) legenda(t, 8.2, 11, ["Fica só de um deles.", "Não entra na partilha."], 640, 66, { cor: "#ffe066" });
}

function cena3(t) { // quando se admite indenização
  const u = t - 11;
  casa(540, 1340, 1.5);
  pessoa(540, 1340, 1.5, { t, humor: "pensando", longo: true, corpo: "#c9748a", cabelo: "#2c1b12" });
  legenda(t, 11.1, 17, ["Quando o STJ admite", "um \"aluguel presumido\"?"], 320, 76);
  legenda(t, 13.0, 17, ["Quando só UM usa", "o imóvel, sozinho."], 560, 74, { cor: "#ffe066" });
  selo(t, 14.4, ["USO EXCLUSIVO"], 540, 790, 62);
  if (u > 3.9) moeda(540 + 300 * suave(t, 15, 1.4), 1110, 1.1, false, t);
}

function cena4(t) { // com os filhos
  casa(520, 1340, 1.5);
  pessoa(360, 1340, 1.25, { t, humor: "feliz", longo: true, corpo: "#c9748a", cabelo: "#2c1b12" });
  pessoa(590, 1340, 0.8, { t, humor: "feliz", corpo: "#f2a65a", cabelo: "#5a3825", fase: 2 });
  pessoa(690, 1340, 0.7, { t, humor: "feliz", corpo: "#79b473", cabelo: "#2c1b12", fase: 3 });
  pessoa(930, 1340, 1.15, { t, humor: "calmo", corpo: "#3f6f9e", cabelo: "#2c1b12", fase: 1 });
  legenda(t, 17.1, 25, ["Mas e se os FILHOS", "moram na casa?"], 300, 80);
  if (t > 19.2) {
    legenda(t, 19.2, 25, ["Para a Terceira Turma", "do STJ, não há", "uso exclusivo."], 570, 70, { cor: "#ffe066" });
    moeda(540, 830, 0.8 * aparece(t, 19.5), true, t);
  }
  if (t > 21.6) {
    const p = suave(t, 21.6, 0.7);
    seta(450, 1215, 550, 1235, "#7fe3a1", p);
    seta(850, 1215, 750, 1235, "#7fe3a1", p);
    legenda(t, 22.2, 25, ["Sustento e moradia dos filhos:", "dever dos DOIS pais"], 1400, 44, { cor: "#9df3b9", largBorda: 7 });
  }
}

function cena5(t) { // atenção
  const e = aparece(t, 25.2, 0.5);
  g.save(); g.translate(540, 790); g.scale(e, e);
  g.fillStyle = "#ffcf33"; g.strokeStyle = "#7a5a00"; g.lineWidth = 10;
  g.beginPath(); g.moveTo(0, -150); g.lineTo(170, 140); g.lineTo(-170, 140); g.closePath(); g.fill(); g.stroke();
  texto("!", 0, 30, 190, { cor: "#5a3b00", borda: null });
  g.restore();
  legenda(t, 25.1, 30, ["ATENÇÃO"], 320, 100, { cor: "#ffe066" });
  legenda(t, 26.3, 30, ["Foi um processo específico.", "Não é regra automática."], 1090, 62);
  legenda(t, 27.8, 30, ["Cada família é diferente."], 1290, 56, { cor: "#9df3b9" });
}

function cenaFinal(t) {
  const e = aparece(t, 30.2, 0.6);
  g.save(); g.translate(540, 520); g.scale(e, e);
  if (logo.complete) g.drawImage(logo, -290, -225, 580, 450);
  g.restore();
  const op = clamp((t - 30.8) / 0.5);
  g.save(); g.globalAlpha = op;
  texto("FERNANDA ROGACIANA", 540, 850, 62, { fonte: "Cormorant Garamond", cor: ROSADO, borda: null, peso: 600 });
  texto("ADVOGADA · OAB/SP 496.545", 540, 920, 36, { peso: 400, cor: ROSADO, borda: null });
  g.restore();
  legenda(t, 31.4, 36, ["Texto completo no blog", "(link na bio)"], 1080, 64);
  g.save(); g.globalAlpha = clamp((t - 32.2) / 0.5);
  texto(["Este conteúdo é apenas informativo e", "não substitui a análise de um caso concreto."], 540, 1260, 38, { peso: 400, cor: CREME, borda: null });
  g.restore();
}

window.desenhar = (t) => {
  g.clearRect(0, 0, 1080, 1920);
  const tt = Math.min(t, DURACAO - 0.01);
  fundo(tt);
  // "soco" de zoom nos cortes, como em vídeos curtos
  const cortes = [0, 5, 11, 17, 25, 30];
  const dc = Math.min(...cortes.map(c => tt - c).filter(d => d >= 0));
  const zoom = 1 + 0.045 * Math.max(0, 1 - dc / 0.25);
  g.save(); g.translate(540, 960); g.scale(zoom, zoom); g.translate(-540, -960);
  if (tt < 5) cena1(tt); else if (tt < 11) cena2(tt); else if (tt < 17) cena3(tt);
  else if (tt < 25) cena4(tt); else if (tt < 30) cena5(tt); else cenaFinal(tt);
  g.restore();
  if (tt < 30) rodape();
};

window.pronto = Promise.all([
  document.fonts.load("900 40px Lato"), document.fonts.load("400 40px Lato"), document.fonts.load("600 40px 'Cormorant Garamond'"),
  new Promise(r => { if (logo.complete) r(); else { logo.onload = r; logo.onerror = r; } }),
]).then(() => document.fonts.ready);
window.DURACAO = DURACAO;
</script>
</body>
</html>
